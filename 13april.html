<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swiggy Clone</title>
    <link rel="stylesheet" href="13april.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">SWIGGY</div>
        <div class="nav-right">
            <a href="#">Partner with us</a>
            <button>Sign up</button>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Hungry? You're in the right place</h1>
        <p>Order food from favourite restaurants near you</p>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" placeholder="Your location">
            <input type="text" placeholder="Search restaurants or more">
        </div>
    </div>

    <!-- Side Images -->
    <div class="side left"></div>
    <div class="side right"></div>

    <!-- Cards Section -->
    <div class="cards">
        <div class="card">
            <div class="icon">🏷️</div>
            <h3>Offers</h3>
        </div>

        <div class="card">
            <div class="icon">🍽️</div>
            <h3>Top restaurants</h3>
        </div>

        <div class="card">
            <div class="icon">🛍️</div>
            <h3>Instamart</h3>
        </div>
    </div>

</body>
</html>
