<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css </title>

    <style>
        /* internal css */
        h1 {
            color: aqua;
            background-color: blueviolet;

        }

        
        
    </style>

    <!-- external css -->

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- like , in css we used properties -->


    <!-- inline css -->

    <p style="color: blue; background-color: rgb(42, 165, 48);">Lorem ipsum dolor sit amet.</p>

    <!-- internal css -->

    <h1>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Deleniti, fuga.</h1>

    <!-- external css -->
    <!-- we used only external css -->

    <h2>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Id nesciunt voluptatem temporibus distinctio
        reiciendis facere!</h2>

</body>

</html>
